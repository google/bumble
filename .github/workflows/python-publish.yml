name: Upload Python Package

on:
  release:
    types: [published]

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Build and publish Python 🐍 distributions 📦 to PyPI via OSS Exit Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out from Git
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Get history and tags for SCM versioning to work
      run: |
        git fetch --prune --unshallow
        git fetch --depth=1 origin +refs/tags/*:refs/tags/*
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build 'twine==6.*'
    - name: Build package
      run: python -m build
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up prior failed staging attempt for this exact version (if any)
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      run: |
        set -euo pipefail
        python .github/scripts/exit_gate_pypi.py cleanup \
          --dist-dir dist \
          --project oss-exit-gate-prod \
          --location us \
          --repository bumble--pypi
    - name: Publish package to PyPI via OSS Exit Gate
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        MANIFEST_PATH="${RUNNER_TEMP}/manifest-bumble.json"
        trap 'rm -f "${MANIFEST_PATH}"' EXIT
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        echo "::add-mask::${TWINE_PASSWORD}"
        TWINE_USERNAME="oauth2accesstoken"
        export TWINE_USERNAME TWINE_PASSWORD
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/bumble--pypi/" \
          dist/*
        unset TWINE_USERNAME TWINE_PASSWORD
        python .github/scripts/exit_gate_pypi.py manifest \
          --dist-dir dist \
          --output "${MANIFEST_PATH}"
        gcloud storage cp --if-generation-match=0 "${MANIFEST_PATH}" \
          "gs://oss-exit-gate-prod-projects-bucket/bumble/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
