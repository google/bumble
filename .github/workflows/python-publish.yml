name: Upload Python Package

on:
  release:
    types: [published]

permissions: {}

jobs:
  deploy:
    name: Build and publish Python 🐍 distributions 📦 to PyPI and TestPyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Check out from Git
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - name: Get history and tags for SCM versioning to work
      run: |
        git fetch --prune --unshallow
        git fetch --depth=1 origin +refs/tags/*:refs/tags/*
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build package
      run: python -m build
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
    - name: Clean up stale releases from staging repo
      run: |
        # clean up stale releases from staging repo
        packages=$(gcloud artifacts packages list \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="bumble--pypi" \
            --format="value(name)" 2>/dev/null)

        echo "${packages}" | xargs -r -I {} sh -c '
            package_name=$(basename "{}")
            echo "Deleting package: $package_name..."
            gcloud artifacts packages delete "{}" \
                --project="oss-exit-gate-prod" \
                --location="us" \
                --repository="bumble--pypi" \
                --quiet
        '

    - name: Publish package to PyPI via OSS Exit Gate
      if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
      run: |
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/bumble--pypi/" \
          -u oauth2accesstoken \
          -p "$(gcloud auth print-access-token)" \
          dist/*
        echo '{"publish_all": true}' > manifest.json
        gcloud storage cp manifest.json \
          "gs://oss-exit-gate-prod-projects-bucket/bumble/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
